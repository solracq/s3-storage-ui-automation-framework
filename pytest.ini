[pytest]
testpaths = tests
markers =
    smoke: High-priority portal smoke coverage for critical user workflows.
    regression: Broader regression coverage beyond the curated smoke suite.
    usability: UI clarity, structure, and usability coverage.
    negative: Negative-path validation for expected error handling.
    edge: Boundary and compatibility coverage for unusual but supported inputs.
    authentication: Login, logout, session, and credential validation coverage.
